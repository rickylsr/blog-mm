name: Validate static blog and CMS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:cms
      - run: npm test
      - run: npm run build
        env:
          VITE_CMS_AUTH_URL: ${{ vars.VITE_CMS_AUTH_URL }}
      - name: Upload static site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: static-blog
          path: _site
          retention-days: 7
